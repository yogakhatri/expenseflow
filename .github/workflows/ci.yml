name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o /tmp/expenseflow ./local
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript
        run: |
          for f in web/*.js cloud/scripts/*.mjs; do node --check "$f"; done
      - name: Check Cloudflare Worker
        run: |
          npm install --prefix cloud
          npm run --prefix cloud check
          cd cloud
          npx wrangler deploy --dry-run
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
      - run: docker compose build
