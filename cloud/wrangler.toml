name = "expenseflow"
main = "worker.ts"
compatibility_date = "2026-10-05"

[assets]
directory = "../web"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/index.html", "/login", "/login.html", "/api", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "expenseflow"
database_id = "4372b728-765c-4363-84b8-49c8fdd652c0"
migrations_dir = "migrations"
